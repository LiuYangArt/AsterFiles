[package]
name = "asterfiles-webdav"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
asterfiles-domain = { path = "../domain" }
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "native-tls"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
rcgen = "0.13.2"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
tokio-rustls = "0.26.2"
