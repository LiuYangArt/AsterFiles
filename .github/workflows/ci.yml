name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: "验证格式检查失败及日志上传（预期本次 CI 失败）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 版本提交已在本地验证，标签工作流负责打包，无需再跑 Windows CI。
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"

      - name: Restore Cargo and kache data
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cache/kache
          key: windows-cargo-kache-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '.kache.toml', 'tools/build.py', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-kache-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '.kache.toml', 'tools/build.py', 'Cargo.lock') }}-
            windows-cargo-kache-

      - name: Install verification dependencies and kache
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 is required.' }
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          python tools/build.py setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inject controlled format failure
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe
        run: |
          Add-Content -LiteralPath src/main.rs -Value "`nfn issue_106_ci_failure_probe( ){ }"

      - name: Run full Debug verification
        run: |
          python tools/verify.py
          exit $LASTEXITCODE

      - name: Save Cargo and kache data
        if: github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cache/kache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify/
            artifacts/logs/
            artifacts/state/
          if-no-files-found: warn
          retention-days: 14